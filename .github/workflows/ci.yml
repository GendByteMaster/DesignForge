name: CI

on:
  push:
    branches:
      - master
      - dev/master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile CLI
        run: python -m py_compile designforge/scripts/designforge.py

      - name: Validate skill package
        run: python designforge/scripts/designforge.py validate

      - name: Run tests
        run: python -m unittest discover -s tests -v
